<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PixelCraft Studio | Sign In preview</title>
<style>
:root{--bg:#070b1a;--tx:#e8ecff;--mu:#97a0c4;--p:#8b5cf6;--b:#2f7bff;--g:linear-gradient(120deg,#8b5cf6,#2f7bff);color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font:16px/1.6 Inter,system-ui,-apple-system,Segoe UI,sans-serif;overflow-x:hidden;display:grid;place-items:center;padding:24px}
/* ---- glow text ---- */
.glow{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px #8b5cf6aa) drop-shadow(0 0 26px #2f7bff88);animation:pulse 3.4s ease-in-out infinite}
@keyframes pulse{50%{filter:drop-shadow(0 0 16px #a78bfa) drop-shadow(0 0 40px #2f7bffcc)}}
.neon{color:#fff;text-shadow:0 0 6px #fff8,0 0 14px #8b5cf6,0 0 30px #8b5cf6,0 0 56px #2f7bff}
/* ---- 3D backdrop ---- */
.scene{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.bl{position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(#8b5cf655,transparent 65%);left:-100px;top:-40px;animation:dr 14s ease-in-out infinite alternate}.bl.b2{background:radial-gradient(#2f7bff55,transparent 65%);left:auto;right:-110px;top:auto;bottom:-60px;animation-delay:-6s}
@keyframes dr{to{transform:translate(80px,60px) scale(1.15)}}
.s3{position:absolute;perspective:700px}
.cube{--s:90px;width:var(--s);height:var(--s);position:relative;transform-style:preserve-3d;animation:spin 20s linear infinite}
.cube i{position:absolute;inset:0;background:var(--tex,var(--g)) center/cover;border:1px solid #ffffff44;box-shadow:inset 0 0 26px #ffffff2e,0 0 24px #6d4bff55}
@keyframes spin{from{transform:rotateX(-25deg) rotateY(0)}to{transform:rotateX(335deg) rotateY(360deg)}}
.ring{width:130px;height:130px;border-radius:50%;border:12px solid transparent;background:linear-gradient(var(--bg),var(--bg)) padding-box,var(--g) border-box;animation:rg 11s linear infinite;box-shadow:0 0 44px #6d4bff66}
@keyframes rg{from{transform:rotateX(68deg) rotateZ(0)}to{transform:rotateX(68deg) rotateZ(360deg)}}
/* ---- nav buttons (original markup) ---- */
main{position:relative;z-index:1;text-align:center}
main h1{font-size:clamp(34px,6vw,60px);margin:0 0 6px;line-height:1.1;font-weight:800}
main p.lead{color:var(--mu);margin:0 0 28px}
.auth-buttons{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.auth-buttons button{font:600 16px inherit;font-family:inherit;border-radius:14px;padding:13px 30px;cursor:pointer;color:#fff;transition:transform .25s,box-shadow .25s}
.login-btn{background:transparent;border:1px solid #8b5cf699;box-shadow:0 0 18px #8b5cf655,inset 0 0 14px #8b5cf622}
.signup-btn{border:0;background:var(--g);box-shadow:0 0 26px #5b4bffaa}
.auth-buttons button:hover{transform:translateY(-3px) perspective(500px) rotateX(8deg);box-shadow:0 0 40px #8b5cf6,0 0 70px #2f7bff88}
/* ---- modal ---- */
.auth-modal{position:fixed;inset:0;z-index:20;display:none;place-items:center;padding:20px;background:#03061099;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);perspective:1100px}
.auth-modal.open{display:grid;animation:fade .3s}
@keyframes fade{from{opacity:0}}
.auth-box{position:relative;width:100%;max-width:420px;padding:34px 30px 28px;border-radius:24px;background:linear-gradient(160deg,#ffffff14,#ffffff08);border:1px solid #ffffff2b;box-shadow:0 0 0 1px #8b5cf633,0 30px 80px #000a,0 0 60px #6d4bff44;transform-style:preserve-3d;transition:transform .15s ease-out;animation:enter .7s cubic-bezier(.2,.9,.2,1)}
@keyframes enter{from{opacity:0;transform:rotateX(-35deg) translateY(40px) scale(.92)}}
.auth-box.flip{animation:flip .55s ease}
@keyframes flip{0%{transform:rotateY(0)}50%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
.auth-box h2{margin:0;font-size:30px;line-height:1.15;transform:translateZ(30px)}
.auth-box #authSubtitle{margin:6px 0 22px;color:var(--mu);transform:translateZ(18px)}
#authForm{display:grid;gap:14px;transform:translateZ(14px)}
#authForm input{width:100%;padding:14px 15px;border-radius:13px;border:1px solid #ffffff2e;background:#070b1acc;color:var(--tx);font:inherit;outline:0;transition:.2s}
#authForm input::placeholder{color:#7d86ab}
#authForm input:focus{border-color:#a78bfa;box-shadow:0 0 0 3px #8b5cf633,0 0 22px #8b5cf666}
#authSubmit{border:0;border-radius:13px;padding:14px;font:700 16px inherit;font-family:inherit;color:#fff;cursor:pointer;background:var(--g);box-shadow:0 0 26px #5b4bffaa;transition:.25s}
#authSubmit:hover{transform:translateY(-2px);box-shadow:0 0 44px #8b5cf6,0 0 70px #2f7bff88}
#authSwitch{margin:18px 0 0;text-align:center;color:var(--mu);font-size:15px}
#authSwitch a{color:#c4b5fd;font-weight:600;text-decoration:none;text-shadow:0 0 12px #8b5cf6}#authSwitch a:hover{text-shadow:0 0 18px #a78bfa,0 0 30px #8b5cf6}
#authMessage{min-height:1.2em;margin:12px 0 0;text-align:center;font-size:14px;color:#bfdbfe}
.close-btn{position:absolute;top:12px;right:14px;width:36px;height:36px;border-radius:50%;border:1px solid #ffffff2b;background:#ffffff10;color:#fff;font-size:22px;line-height:1;cursor:pointer;transition:.25s;transform:translateZ(40px)}
.close-btn:hover{transform:translateZ(40px) rotate(90deg);box-shadow:0 0 18px #8b5cf6}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #a78bfa;outline-offset:3px}
@media(max-width:1000px){.s3{display:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body>
<div class="scene" aria-hidden="true"><b class="bl"></b><b class="bl b2"></b>
<div class="s3" style="left:8%;top:22%"><div class="cube"><i style="transform:translateZ(45px)"></i><i style="transform:rotateY(180deg) translateZ(45px)"></i><i style="transform:rotateY(90deg) translateZ(45px)"></i><i style="transform:rotateY(-90deg) translateZ(45px)"></i><i style="transform:rotateX(90deg) translateZ(45px)"></i><i style="transform:rotateX(-90deg) translateZ(45px)"></i></div></div>
<div class="s3" style="right:11%;top:16%"><div class="cube" style="--s:56px;animation-direction:reverse"><i style="transform:translateZ(28px)"></i><i style="transform:rotateY(180deg) translateZ(28px)"></i><i style="transform:rotateY(90deg) translateZ(28px)"></i><i style="transform:rotateY(-90deg) translateZ(28px)"></i><i style="transform:rotateX(90deg) translateZ(28px)"></i><i style="transform:rotateX(-90deg) translateZ(28px)"></i></div></div>
<div class="s3" style="right:7%;bottom:18%"><div class="ring"></div></div></div>

<main>
<h1><span class="glow">PixelCraft</span> <span class="neon">Studio</span></h1>
<p class="lead">Sign in to track your website projects.</p>

<div class="auth-buttons">
    <button class="login-btn" onclick="openAuth('login')">
        Sign In
    </button>

    <button class="signup-btn" onclick="openAuth('signup')">
        Sign Up
    </button>
</div>
</main>

<!-- Authentication Modal -->
<div id="authModal" class="auth-modal">
    <div class="auth-box" id="authBox">

        <button class="close-btn" onclick="closeAuth()" aria-label="Close">×</button>

        <h2 id="authTitle" class="neon">Welcome Back!</h2>
        <p id="authSubtitle">Sign in to your account</p>

        <form id="authForm">

            <input type="text" id="name"
                placeholder="Full Name" hidden>

            <input type="email" id="email"
                placeholder="Email Address" required>

            <input type="password" id="password"
                placeholder="Password" required>

            <button type="submit" id="authSubmit">
                Sign In
            </button>

        </form>

        <p id="authSwitch">
            Don't have an account?
            <a href="#" onclick="switchAuth('signup')">Sign Up</a>
        </p>

        <p id="authMessage"></p>
    </div>
</div>

<script>
(function(){
  // generated 3D cube texture (no external images)
  const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,256,256);g.addColorStop(0,'#9b6bff');g.addColorStop(.55,'#4f6bff');g.addColorStop(1,'#1fa2ff');x.fillStyle=g;x.fillRect(0,0,256,256);
  for(let i=0;i<16;i++)for(let j=0;j<16;j++){x.fillStyle='rgba(255,255,255,'+Math.random()*.14+')';x.fillRect(i*16,j*16,15,15)}
  const q=x.createRadialGradient(60,50,5,60,50,200);q.addColorStop(0,'rgba(255,255,255,.5)');q.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=q;x.fillRect(0,0,256,256);
  document.documentElement.style.setProperty('--tex','url('+c.toDataURL()+')');
})();

const modal=document.getElementById('authModal'),box=document.getElementById('authBox'),
  $=id=>document.getElementById(id);
let mode='login';

function setMode(m){
  mode=m;const s=m==='signup';
  $('authTitle').textContent=s?'Create Account':'Welcome Back!';
  $('authSubtitle').textContent=s?'Sign up to get started':'Sign in to your account';
  $('authSubmit').textContent=s?'Sign Up':'Sign In';
  $('name').hidden=!s;$('name').required=s;
  $('authSwitch').innerHTML=s
    ?'Already have an account? <a href="#" onclick="switchAuth(\'login\')">Sign In</a>'
    :'Don\'t have an account? <a href="#" onclick="switchAuth(\'signup\')">Sign Up</a>';
  $('authMessage').textContent='';
}
function openAuth(m){setMode(m||'login');modal.classList.add('open');document.body.style.overflow='hidden';setTimeout(()=>(m==='signup'?$('name'):$('email')).focus(),350)}
function closeAuth(){modal.classList.remove('open');document.body.style.overflow='';box.style.transform=''}
function switchAuth(m){ // 3D flip between Sign In and Sign Up
  event&&event.preventDefault&&event.preventDefault();
  box.classList.remove('flip');void box.offsetWidth;box.classList.add('flip');
  setTimeout(()=>setMode(m),250);setTimeout(()=>box.classList.remove('flip'),600);
}
modal.addEventListener('click',e=>{if(e.target===modal)closeAuth()});
addEventListener('keydown',e=>{if(e.key==='Escape')closeAuth()});
// mouse tilt
if(matchMedia('(hover:hover)').matches&&!matchMedia('(prefers-reduced-motion:reduce)').matches){
  modal.addEventListener('pointermove',e=>{if(box.classList.contains('flip'))return;const b=box.getBoundingClientRect(),
    px=(e.clientX-b.left)/b.width-.5,py=(e.clientY-b.top)/b.height-.5;
    box.style.transform='rotateX('+Math.max(-7,Math.min(7,-py*9))+'deg) rotateY('+Math.max(-9,Math.min(9,px*11))+'deg)'});
  modal.addEventListener('pointerleave',()=>box.style.transform='');
}
// This file is a visual preview. Real sign-in is handled by the Supabase project (pixelcraft-auth).
$('authForm').addEventListener('submit',e=>{e.preventDefault();
  $('authMessage').textContent='Preview only: this form is not connected to Supabase yet.'});
</script>
</body></html>
